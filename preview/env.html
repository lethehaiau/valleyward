<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valleyward · environment bench</title>
  <style>
    html,body{margin:0;height:100%;background:#0b1c24;overflow:hidden;font:12px/1.35 ui-monospace,Menlo,monospace;color:#cfe8ee}
    #world{position:fixed;inset:0}
    #hud{position:fixed;left:8px;top:8px;background:#0b1c24cc;padding:8px 10px;border:1px solid #2c5168;min-width:250px}
    #hud.hidden{display:none}
    #hud label{display:block;margin:3px 0}
    #hud button{font:inherit;background:#184255;color:#cfe8ee;border:1px solid #2c5168;margin:2px 2px 0 0;padding:2px 6px;cursor:pointer}
    #stats{white-space:pre;margin-top:6px;color:#9ee1e9}
  </style>
</head>
<body>
  <div id="world"></div>
  <div id="hud">
    <b>ENV bench</b> · views:
    <div><button data-view="m1">m1</button><button data-view="m2">m2</button><button data-view="top">top</button><button data-view="gate">gate</button><button data-view="walk">walk</button><button data-view="beacon">beacon</button><button data-view="free">free</button></div>
    <div><button data-view="camp_w">camp_w</button><button data-view="camp_e">camp_e</button><button data-view="stall">stall</button><button data-view="campwalk">campwalk</button><button data-view="shadow">shadow</button><button data-view="banners">banners</button><button data-view="glance">glance</button></div>
    <div><button id="campOn">camp</button><button id="campOff">night</button><button id="n1">night I</button><button id="n2">night II</button><button id="near">near pad 0</button></div>
    <label><input type="checkbox" id="fire" /> fake fire light (F)</label>
    <label><input type="checkbox" id="stub" checked /> stub fluid pass</label>
    <label>dawn <input type="range" id="dawn" min="0" max="1" step="0.01" value="0" /></label>
    <label>gate hp <input type="range" id="gate" min="0" max="1" step="0.01" value="1" /></label>
    <div><button id="kindle">kindle</button><button id="barrel">burst barrel</button><button id="trough">light trough</button><button id="tone">tone: neutral</button></div>
    <div id="stats"></div>
  </div>
  <script type="module" src="./env.js"></script>
</body>
</html>
