<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valleyward</title>
  <meta name="description" content="Valleyward: hold a hilltop keep through one night against a goblin horde with gun and fluid fire." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-7z%22 fill=%22%23e36a25%22/%3E%3C/svg%3E" />
  <link rel="preload" href="./assets/fonts/silkscreen-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    :root {
      --ew-cursor: url('/assets/ui/cursor-arrow.png') 2 2, default;
      --ew-cursor-action: url('/assets/ui/cursor-hand.png') 8 2, pointer;
      cursor: var(--ew-cursor);
    }
    @media (forced-colors: active) {
      :root { --ew-cursor: default; --ew-cursor-action: pointer; }
    }
  </style>
  <style>html,body{margin:0;height:100%;background:#0b1c24;overflow:hidden}#world{position:fixed;inset:0}#ui{position:fixed;inset:0;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0b1c24;color:#9ee1e9;font:400 20px/1 monospace;letter-spacing:.3em;transition:opacity .8s;z-index:50}#loading.done{opacity:0;pointer-events:none}#loading .ld{display:flex;flex-direction:column;align-items:center}#loading .ld-bar{width:min(64vw,16em);height:calc(var(--p,2.5px)*4);margin-top:1.5em;padding:var(--p,2.5px);border:var(--p,2.5px) solid #a4e6ee;background:#061015;box-shadow:0 0 0 var(--p,2.5px) #0a1115;box-sizing:content-box}#loading .ld-bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(var(--f,0));transition:transform .25s linear;background:repeating-linear-gradient(90deg,#eafcff 0 calc(var(--p,2.5px)*3),#a4e6ee calc(var(--p,2.5px)*3) calc(var(--p,2.5px)*5),#061015 calc(var(--p,2.5px)*5) calc(var(--p,2.5px)*6))}#loading .ld-bar:not(.live) i{animation:ld-pre 6s cubic-bezier(.2,.7,.4,1) forwards}@keyframes ld-pre{from{transform:scaleX(0)}to{transform:scaleX(.12)}}#loading .ld-step{margin-top:1.2em;font-size:.5em;letter-spacing:.3em;color:#a4e6ee;opacity:.9;white-space:nowrap}@media (prefers-reduced-motion:reduce){#loading .ld-bar i{transition:none}}</style>
</head>
<body>
  <div id="world"></div>
  <div id="ui"></div>
  <div id="loading"><div class="ld"><div class="ld-name">VALLEYWARD</div><div class="ld-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><div class="ld-step">LOADING</div></div></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
